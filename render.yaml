services:
  - type: web
    name: tesladrive
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tesladrive-db
          property: connectionString

      - key: TESLA_CLIENT_ID
        sync: false

      - key: TESLA_CLIENT_SECRET
        sync: false

      - key: TESLA_REDIRECT_URI
        sync: false

      - key: APP_BASE_URL
        sync: false

      - key: TESLA_AUDIENCE
        value: https://fleet-api.prd.eu.vn.cloud.tesla.com

      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: tesladrive-db
    plan: free
    region: frankfurt
    databaseName: tesladrive
    user: tesladrive
